  borderRadius: { 'DEFAULT': '0.25rem','lg': '0.5rem','xl': '0.75rem','full': '9999px' },
  spacing: { 'space-xs': '0.25rem','space-sm': '0.5rem','space-md': '0.75rem','space-lg': '1rem','space-xl': '1.5rem','margin': '1rem','margin-desktop': '2.5rem' },
  fontFamily: { 'label-lg': ['Plus Jakarta Sans'],'label-sm': ['Plus Jakarta Sans'],'headline-lg': ['Plus Jakarta Sans'],'title-md': ['Plus Jakarta Sans'],'body-lg': ['Plus Jakarta Sans'],'headline-md': ['Plus Jakarta Sans'],'body-sm': ['Plus Jakarta Sans'],'label-md': ['Plus Jakarta Sans'],'display-lg': ['Plus Jakarta Sans'],'headline-sm': ['Plus Jakarta Sans'],'body-md': ['Plus Jakarta Sans'] },
  fontSize: { 'label-lg': ['14px',{lineHeight:'20px',fontWeight:'600'}],'label-sm': ['10px',{lineHeight:'14px',letterSpacing:'0.04em',fontWeight:'700'}],'headline-lg': ['28px',{lineHeight:'36px',fontWeight:'700'}],'title-md': ['16px',{lineHeight:'24px',fontWeight:'600'}],'body-lg': ['16px',{lineHeight:'24px',fontWeight:'400'}],'headline-md': ['22px',{lineHeight:'30px',fontWeight:'600'}],'body-sm': ['12px',{lineHeight:'18px',fontWeight:'400'}],'label-md': ['12px',{lineHeight:'16px',fontWeight:'600'}],'display-lg': ['36px',{lineHeight:'44px',fontWeight:'700'}],'headline-sm': ['18px',{lineHeight:'26px',fontWeight:'600'}],'body-md': ['14px',{lineHeight:'20px',fontWeight:'400'}] }

<div class="fixed top-[116px] inset-x-0 z-40 px-margin pt-2">

<main class="flex-1 flex flex-col w-full overflow-hidden pt-[164px] pb-[96px] bg-surface" id="messagesWrap">
  <div class="flex-1 overflow-y-auto w-full" id="messagesScroll">

<footer class="fixed bottom-0 inset-x-0 z-50 bg-surface/95 backdrop-blur-xl border-t border-outline-variant/40 pb-safe">
  <div class="max-w-3xl mx-auto px-margin py-2.5 flex items-end gap-2">

      <span class="material-symbols-outlined text-[22px]">add_circle</span>

    <div class="flex-1 relative flex items-end bg-surface-container-low rounded-3xl shadow-[inset_0_2px_4px_rgba(43,43,40,0.05)] px-3 py-1.5 min-h-[44px]">
      <textarea id="messageInput" rows="1" placeholder="Message..." class="flex-1 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none resize-none py-1.5 max-h-32" style="min-height: 24px;"></textarea>
    </div>

      <div class="flex flex-col min-w-0">

  <div class="bg-surface-container-lowest rounded-t-3xl sm:rounded-3xl w-full sm:max-w-sm p-space-lg flex flex-col gap-space-sm pb-8 sm:pb-space-lg">

<div class="fixed top-24 left-1/2 -translate-x-1/2 z-[80] transition-all duration-300 transform -translate-y-6 opacity-0 pointer-events-none px-margin py-space-sm rounded-full bg-inverse-surface text-inverse-on-surface shadow-lg flex items-center gap-space-sm font-label-md text-label-md" id="toastNotification">
  <span class="material-symbols-outlined text-primary-fixed-dim text-[18px]">check_circle</span>
  <span id="toastMessage">Action completed</span>
</div>

<script>
(function () {
  const API = window.API_BASE || 'http://localhost:5000';
  const USER_KEY = 'turontoo_user';

  const authUser = JSON.parse(localStorage.getItem(USER_KEY) || 'null');
  if (!authUser || !authUser.id) {
    window.location.href = 'login.html';
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const gigId = params.get('gig');
  const withId = params.get('with');

  if (!gigId || !withId) {
    alert('Missing chat parameters.');
    history.back();
    return;
  }

  let partner = { id: withId, full_name: 'User', full_name_bn: null, avatar_url: null };
  let gig = { id: gigId, title_bn: 'Job', title: 'Job' };
  let messages = [];
  let lastFetchCount = 0;

  const QUICK_REPLIES = [
    { label: "I'm on my way", text: "I'm on my way 🚗" },
    { label: 'Reached', text: 'Reached the location 📍' },
    { label: 'Starting now', text: 'Starting the work now ✅' },
    { label: 'Almost done', text: 'Almost done, 10 more minutes' },
    { label: 'Done — please pay', text: 'Done — please release payment 🙏' }
  ];

  function initials(name) {
    if (!name) return '?';
    return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  function dayLabel(iso) {
    const d = new Date(iso);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    if (sameDay(d, today)) return 'Today';
    if (sameDay(d, yesterday)) return 'Yesterday';
    return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toastNotification');
    const l = document.getElementById('toastMessage');
    if (!t || !l) return;
    l.textContent = msg;
    const icon = t.querySelector('.material-symbols-outlined');
    if (icon) {
      if (type === 'error') icon.className = 'material-symbols-outlined text-error text-[18px]';
      else if (type === 'info') icon.className = 'material-symbols-outlined text-primary-fixed-dim text-[18px]';
      else icon.className = 'material-symbols-outlined text-primary-fixed-dim text-[18px]';
    }
    t.classList.remove('opacity-0', '-translate-y-6', 'pointer-events-none');
    t.classList.add('opacity-100', 'translate-y-0');
    setTimeout(() => {
      t.classList.remove('opacity-100', 'translate-y-0');
      t.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none');
    }, 2400);
  }

  // ---------- LOAD HEADER DATA ----------
  async function loadHeaderData() {
    try {
      const [gRes, uRes] = await Promise.all([
        fetch(`${API}/api/gigs/${gigId}`),
        fetch(`${API}/api/users/${withId}`)
      ]);
      const gData = await gRes.json();
      const uData = await uRes.json();

      if (gData.ok && gData.gig) gig = gData.gig;
      if (uData.ok && uData.user) partner = uData.user;

      const pName = partner.full_name_bn || partner.full_name || 'User';
      document.getElementById('partner-name').textContent = pName;
      document.getElementById('partner-avatar').textContent = initials(pName);
      document.getElementById('partner-link').href = `profile.html?id=${partner.id}`;
      document.getElementById('job-context').href = `job-details.html?id=${gig.id}`;
      document.getElementById('job-title').textContent = gig.title_bn || gig.title;
      document.title = `${pName} — Turontoo Chat`;
    } catch (e) {
      console.error('loadHeaderData:', e);
    }
  }

  // ---------- LOAD MESSAGES ----------
  async function loadMessages(showLoading) {
    const list = document.getElementById('messagesList');
    if (showLoading) {
      list.innerHTML = '<div class="text-center py-8"><span class="material-symbols-outlined text-[36px] text-outline">progress_activity</span><p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Loading messages...</p></div>';
    }
    try {
      const res = await fetch(`${API}/api/messages/${gigId}/${authUser.id}/${withId}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);

      const incoming = data.messages || [];
      if (incoming.length !== lastFetchCount || showLoading) {
        messages = incoming;
        lastFetchCount = incoming.length;
        renderMessages();
      }
    } catch (e) {
      console.error('loadMessages:', e);
      if (showLoading) {
        list.innerHTML = '<div class="text-center py-8"><span class="material-symbols-outlined text-[36px] text-error">cloud_off</span><p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Could not load messages</p></div>';
      }
    }
  }

  function renderMessages() {
    const list = document.getElementById('messagesList');
    list.innerHTML = '';

    if (!messages.length) {
      list.innerHTML = `
        <div class="flex flex-col items-center justify-center text-center gap-2 py-16 text-on-surface-variant">
          <span class="material-symbols-outlined text-[48px] text-outline">chat_bubble_outline</span>
          <p class="font-title-md text-title-md text-on-surface">No messages yet</p>
          <p class="font-body-sm text-body-sm max-w-xs">Say hi to get the conversation started. Keep all chats in Turontoo for your safety.</p>
        </div>`;
      return;
    }

    let lastDay = '';
    messages.forEach(m => {
      const day = dayLabel(m.created_at);
      if (day !== lastDay) {
        const sep = document.createElement('div');
        sep.className = 'flex items-center justify-center my-3';
        sep.innerHTML = `<span class="px-3 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm">${day}</span>`;
        list.appendChild(sep);
        lastDay = day;
      }
      list.appendChild(renderBubble(m));
    });

    requestAnimationFrame(() => {
      const scroll = document.getElementById('messagesScroll');
      scroll.scrollTop = scroll.scrollHeight;
    });
  }

  function renderBubble(m) {
    const wrap = document.createElement('div');
    const mine = m.sender_id === authUser.id;
    wrap.className = `flex ${mine ? 'justify-end' : 'justify-start'} px-1`;

    let inner = '';
    const type = m.message_type || 'text';
    if (type === 'text') {
      inner = `<p class="font-body-md text-body-md leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(m.content || '')}</p>`;
    } else if (type === 'location') {
      inner = `
        <div class="flex flex-col gap-2 min-w-[200px]">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px]">location_on</span>
            <span class="font-label-md text-label-md font-semibold">Shared Location</span>
          </div>
          <div class="w-full h-24 rounded-lg bg-surface-container-high flex items-center justify-center">
            <span class="material-symbols-outlined text-[36px] text-outline">map</span>
          </div>
          <p class="font-body-sm text-body-sm leading-snug">${escapeHtml(m.content || '')}</p>
        </div>`;
    } else if (type === 'gig') {
      inner = `
        <div class="flex flex-col gap-1 min-w-[200px]">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">work</span>
            <span class="font-label-sm text-label-sm font-semibold uppercase">Job Reference</span>
          </div>
          <span class="font-title-md text-title-md font-semibold leading-snug">${escapeHtml(m.content || '')}</span>
        </div>`;
    } else {
      inner = `<p class="font-body-md text-body-md">${escapeHtml(m.content || '')}</p>`;
    }

    const bubbleClass = mine
      ? 'bg-primary-container text-on-primary-container'
      : 'bg-surface-container-lowest text-on-surface shadow-sm';

    wrap.innerHTML = `
      <div class="max-w-[80%] sm:max-w-[70%] flex flex-col ${mine ? 'items-end' : 'items-start'}">
        <div class="px-3.5 py-2 rounded-2xl ${bubbleClass}">
          ${inner}
        </div>
        <div class="flex items-center gap-1 mt-0.5 px-1">
          <span class="font-label-sm text-label-sm text-outline">${fmtTime(m.created_at)}</span>
        </div>
      </div>`;
    return wrap;
  }

  // ---------- SEND MESSAGE ----------
  async function sendMessage(content, type = 'text') {
    const t = (content || '').trim();
    if (!t) return;

    // Optimistic
    const optimistic = {
      id: 'temp-' + Date.now(),
      sender_id: authUser.id,
      receiver_id: withId,
      gig_id: gigId,
      content: t,
      message_type: type,
      created_at: new Date().toISOString()
    };
    messages.push(optimistic);
    renderMessages();

    try {
      const res = await fetch(`${API}/api/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          gig_id: gigId,
          sender_id: authUser.id,
          receiver_id: withId,
          content: t,
          message_type: type
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);

      // Replace optimistic with real
      messages = messages.filter(x => x.id !== optimistic.id);
      messages.push(data.message);
      lastFetchCount = messages.length;
      renderMessages();
    } catch (e) {
      console.error('sendMessage:', e);
      messages = messages.filter(x => x.id !== optimistic.id);
      renderMessages();
      showToast('Failed to send: ' + e.message, 'error');
    }
  }

  // ---------- COMPOSER ----------
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('send-btn');

  function updateSendState() { sendBtn.disabled = !input.value.trim(); }
  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 128) + 'px';
  }

  input.addEventListener('input', () => { updateSendState(); autoResize(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) {
        sendMessage(input.value);
        input.value = '';
        autoResize();
        updateSendState();
      }
    }
  });
  sendBtn.addEventListener('click', () => {
    sendMessage(input.value);
    input.value = '';
    autoResize();
    updateSendState();
  });

  // ---------- QUICK REPLIES ----------
  function renderQuickReplies() {
    const wrap = document.getElementById('quickReplies');
    QUICK_REPLIES.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'shrink-0 px-3 py-1.5 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md transition-colors active:scale-95';
      btn.textContent = q.label;
      btn.addEventListener('click', () => sendMessage(q.text));
      wrap.appendChild(btn);
    });
  }

  // ---------- ATTACH MENU ----------
  const attachModal = document.getElementById('attach-modal');
  function openAttach() { attachModal.classList.remove('hidden'); attachModal.classList.add('flex'); }
  function closeAttach() { attachModal.classList.add('hidden'); attachModal.classList.remove('flex'); }
  document.getElementById('attach-btn').addEventListener('click', openAttach);
  document.getElementById('attach-cancel').addEventListener('click', closeAttach);
  attachModal.addEventListener('click', e => { if (e.target === attachModal) closeAttach(); });

  document.querySelectorAll('[data-attach]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.dataset.attach;
      closeAttach();

      if (kind === 'location') {
        if (!navigator.geolocation) { showToast('Location not supported', 'error'); return; }
        showToast('Getting location...', 'info');
        navigator.geolocation.getCurrentPosition(
          pos => sendMessage(`Lat ${pos.coords.latitude.toFixed(4)}, Lng ${pos.coords.longitude.toFixed(4)}`, 'location'),
          () => sendMessage('Current location (precise unavailable)', 'location'),
          { timeout: 5000 }
        );
      }
      if (kind === 'gig') sendMessage(gig.title_bn || gig.title, 'gig');
    });
  });

  // ---------- MORE MENU ----------
  const moreModal = document.getElementById('more-modal');
  function openMore() { moreModal.classList.remove('hidden'); moreModal.classList.add('flex'); }
  function closeMore() { moreModal.classList.add('hidden'); moreModal.classList.remove('flex'); }
  document.getElementById('more-btn').addEventListener('click', openMore);
  document.getElementById('more-cancel').addEventListener('click', closeMore);
  moreModal.addEventListener('click', e => { if (e.target === moreModal) closeMore(); });

  document.querySelectorAll('[data-more]').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.more;
      closeMore();
      if (k === 'view-profile') window.location.href = `profile.html?id=${partner.id}`;
      else if (k === 'view-job') window.location.href = `job-details.html?id=${gigId}`;
      else if (k === 'report') window.location.href = `report.html?type=account&id=${partner.id}`;
    });
  });

  document.getElementById('call-btn').addEventListener('click', () => {
    showToast('Calling is not available yet', 'info');
  });

  // ---------- BOOT ----------
  renderQuickReplies();
  updateSendState();
  autoResize();

  (async () => {
    await loadHeaderData();
    await loadMessages(true);
    // Poll every 5s for new messages
    setInterval(() => loadMessages(false), 5000);
  })();

  if (window.TurontooUser && window.TurontooUser.applyAvatar) window.TurontooUser.applyAvatar();
})();
</script>
</body>
</html>
